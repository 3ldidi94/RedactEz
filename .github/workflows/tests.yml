name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt -r web/requirements.txt
      # No Tesseract here: the OCR tests skip themselves, which is what a
      # plain install looks like.
      - name: Tests
        run: python -m unittest discover -s tests -v

  ocr:
    name: OCR (Tesseract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
      - name: Install
        run: python -m pip install -r requirements.txt -r web/requirements.txt
      - name: Check OCR
        run: python -m redactez --check-ocr
      - name: Tests
        run: python -m unittest discover -s tests -v

  package:
    name: Package and CLI entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the package
        run: python -m pip install .
      - name: Run the installed command
        run: |
          cd "$RUNNER_TEMP"
          redactez --version
          redactez --list-types

  docker:
    name: Web image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f web/Dockerfile -t redactez-web .
      - name: Smoke test
        run: |
          docker run -d --name rz -e BIND=0.0.0.0 -p 8020:8020 redactez-web
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8020/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8020/ | grep -q RedactEz
